name: Testar e gerar aplicativos
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL HTTPS da API (vazia usa o endereço padrão)'
        required: false
        default: ''
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-password-local-only
          POSTGRES_DB: investir_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-password-local-only@localhost:5432/investir_test
      TEST_SYNTHETIC_WORKBOOKS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q --tb=short
        working-directory: backend
  native:
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: macos-14
            target: macos
    runs-on: ${{ matrix.os }}
    env:
      API_BASE_URL: ${{ inputs.api_url || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.target == 'android'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Configurar assinatura Android persistente, quando fornecida
        if: matrix.target == 'android' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 frontend/tool/bootstrap.py
          python3 - <<'PY'
          import os,base64,pathlib
          if os.environ.get('KEYSTORE_BASE64'):
              root=pathlib.Path('frontend/android')
              (root/'investir-release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
              props={'storeFile':'../investir-release.jks','storePassword':os.environ['KEYSTORE_PASSWORD'],'keyAlias':os.environ['KEY_ALIAS'],'keyPassword':os.environ['KEY_PASSWORD']}
              (root/'key.properties').write_text('\n'.join(k+'='+v for k,v in props.items()))
          else:
              print('Sem chave persistente: APK de teste, assinado com chave debug.')
          PY
      - name: Validar e compilar
        run: bash scripts/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Investir-${{ matrix.target }}
          path: dist/*
          retention-days: 14
