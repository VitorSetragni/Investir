# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Banco externo no Supabase; este Blueprint cria somente a API.
services:
  - type: web
    name: investir-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: DEMO_MODE
        value: "false"
      - key: MARKET_CACHE_SECONDS
        value: "900"
      - key: SUPABASE_URL
        value: https://stnckjpqjebsftcnlywu.supabase.co
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: UPLOADER_EMAILS
        sync: false
